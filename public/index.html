<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>经营指挥中心 · V5</title>
<style>
/* ═══ 主题变量体系（统一在此管理，避免硬编码散落）═══ */
:root{
  --brand:#1168b7;--brand-ink:#ffffff;
  --bg:#F4F7FB;--card:#FFFFFF;--card2:#FBFCFE;--border:#E4E9F0;
  --title:#0E233A;--body:#415567;--sub:#5F7181;--dim:#94A3B8;
  --ok:#16a34a;--warn:#d97706;--crit:#dc2626;--info:#2563eb;
  --grad:linear-gradient(135deg,#1168b7,#0e9488);
  --radius:14px;--shadow:0 1px 3px rgba(14,35,58,.06),0 6px 20px rgba(14,35,58,.05);
  --c1:#1168b7;--c2:#0e9488;--c3:#d97706;--c4:#8b5cf6;--c5:#ef4444;
}
/* 深色：石墨 */
html[data-theme="dark"]{
  --brand:#5aa9ff;--brand-ink:#0b1220;
  --bg:#0f1620;--card:#18222f;--card2:#141d29;--border:#2a3646;
  --title:#e6edf5;--body:#aebccb;--sub:#8b9aab;--dim:#5d6c7d;
  --ok:#4ade80;--warn:#fbbf24;--crit:#f87171;--info:#60a5fa;
  --grad:linear-gradient(135deg,#3b82f6,#22d3ee);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --c1:#5aa9ff;--c2:#2dd4bf;--c3:#fbbf24;--c4:#a78bfa;--c5:#f87171;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--title);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding-bottom:78px;transition:background .3s,color .3s}

/* ── topbar ── */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:11px 20px;font-size:12px;color:var(--sub);border-bottom:1px solid var(--border);background:var(--card);position:sticky;top:0;z-index:50;backdrop-filter:blur(10px)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.dot.off{background:var(--crit);box-shadow:0 0 6px var(--crit)}
.dot.stale{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.topbar .r{display:flex;align-items:center;gap:12px}
.stale-tip{font-size:11px;color:var(--warn);display:none}
.stale-tip.show{display:inline}

/* ── header ── */
.header{padding:20px 20px 14px}
.header h1{font-size:20px;font-weight:800;color:var(--title);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header .tag{display:inline-block;background:var(--grad);color:var(--brand-ink);font-size:10px;padding:2px 9px;border-radius:20px;margin-left:6px;font-weight:700}
.header .sub{font-size:12px;color:var(--sub);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.phase-chip{font-size:10px;padding:2px 8px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--sub)}

/* ── 模块标签栏 ── */
.tabs{position:sticky;top:54px;z-index:49;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:5px;padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap;border:1px solid transparent;transition:all .2s}
.tab svg{width:16px;height:16px}
.tab:hover{color:var(--brand)}
.tab.active{background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 10px rgba(17,104,183,.25)}
.tab .cnt{font-size:10px;background:var(--crit);color:#fff;padding:0 5px;border-radius:8px;font-weight:700}

/* ── card ── */
.page{display:none;padding:14px 16px 30px;max-width:1180px;margin:0 auto}.page.active{display:block}
.card{margin-bottom:14px;padding:18px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:14px;font-size:13px;font-weight:800;color:var(--title)}
.card-h::before{content:'';width:4px;height:15px;background:var(--grad);border-radius:2px}
.card-h .hint{font-size:11px;color:var(--dim);font-weight:400;margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}

/* ── KPI ── */
.kpi{padding:15px;background:var(--card2);border:1px solid var(--border);border-radius:12px;position:relative;overflow:hidden}
.kpi::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--grad);opacity:.9}
.kpi-num{font-size:26px;font-weight:800;line-height:1;color:var(--title)}
.kpi-num.warn{color:var(--warn)}.kpi-num.crit{color:var(--crit)}.kpi-num.ok{color:var(--ok)}.kpi-num.muted{color:var(--dim);font-size:18px}
.kpi-label{font-size:12px;color:var(--sub);margin-top:8px}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:3px}

/* ── badge / state ── */
.badge{font-size:10.5px;padding:2px 9px;border-radius:11px;font-weight:600;display:inline-block}
.b-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.b-warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.b-crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.b-info{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
.b-mute{background:var(--card2);border:1px solid var(--border);color:var(--dim)}
.b-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:4px}

/* ── progress ── */
.prog{height:10px;background:var(--border);border-radius:6px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* ── table ── */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.t{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px}
.t th{text-align:left;padding:9px 11px;color:var(--sub);font-weight:700;border-bottom:2px solid var(--border);font-size:11px;white-space:nowrap}
.t td{padding:9px 11px;border-bottom:1px solid var(--border);color:var(--body);vertical-align:middle}
.t tr:hover td{background:color-mix(in srgb,var(--brand) 4%,transparent)}
.st{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:600}
.st-pass{background:color-mix(in srgb,var(--ok)16%,transparent);color:var(--ok)}
.st-pending{background:color-mix(in srgb,var(--info)15%,transparent);color:var(--info)}
.st-fail{background:color-mix(in srgb,var(--crit)14%,transparent);color:var(--crit)}
.st-block{background:color-mix(in srgb,var(--warn)18%,transparent);color:var(--warn)}
.st-mute{background:var(--card2);color:var(--dim)}

/* ── empty / list ── */
.empty{text-align:center;padding:30px 10px;color:var(--dim);font-size:13px}
.empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px}
.li{padding:11px 13px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
.li-t{font-size:13px;font-weight:600;color:var(--title);line-height:1.4}
.li-m{font-size:11px;color:var(--dim);margin-top:3px}

/* ── risk / diag ── */
.risk{padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:10px;margin-bottom:9px;border-left:4px solid var(--dim)}
.risk.critical{border-left-color:var(--crit)}
.risk.warning{border-left-color:var(--warn)}
.risk.info{border-left-color:var(--info)}
.risk-t{font-size:13px;font-weight:700;color:var(--title);display:flex;align-items:center;gap:7px}
.risk-m{font-size:12px;color:var(--body);margin-top:4px;line-height:1.55}
.risk-s{font-size:11px;color:var(--dim);margin-top:5px}

/* ── chart ── */
canvas{width:100%!important;height:180px!important;display:block}
.chl{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:5px}

/* ── timeline ── */
.tl{position:relative;padding-left:20px}
.tl::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-i{position:relative;margin-bottom:14px;padding-left:12px}
.tl-i::before{content:'';position:absolute;left:-18px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--brand);border:3px solid var(--card)}
.tl-i.milestone::before{background:var(--warn)}.tl-i.incident::before{background:var(--crit)}.tl-i.growth::before{background:var(--ok)}.tl-i.data::before{background:var(--c2)}.tl-i.report::before{background:var(--c4)}
.tl-d{font-size:11px;color:var(--dim);font-weight:700}
.tl-t{font-size:13px;color:var(--title);margin-top:2px;font-weight:600}

/* ── search ── */
.search{width:100%;padding:10px 13px;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--title);font-size:13.5px;outline:none;margin-bottom:10px}
.search:focus{border-color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:6px 11px;border-radius:18px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--sub);cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}

/* ── theme panel ── */
.tg{display:flex;gap:8px;flex-wrap:wrap}
.tg button{padding:9px 13px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--body);font-size:12.5px;font-weight:600;cursor:pointer}
.tg button.on{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 2px color-mix(in srgb,var(--brand)20%,transparent)}
.preset{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
@media(max-width:640px){.preset{grid-template-columns:repeat(3,1fr)}}
.preset button{text-align:left;padding:10px;border-radius:10px;border:2px solid var(--border);background:var(--card2);cursor:pointer;font-size:11px;font-weight:600}
.preset button.on{border-color:var(--brand)}
.preset .sw{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-bottom:6px;border:1px solid var(--border)}
.preset .sw i{flex:1}
.colorrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.colorrow:last-child{border-bottom:none}
.colorrow label{flex:1;font-size:12.5px;color:var(--body)}
.colorrow input[type=color]{width:34px;height:34px;border:2px solid var(--border);border-radius:8px;cursor:pointer;background:none;padding:0}
.colorrow .hex{font-size:11px;color:var(--dim);font-family:monospace;width:66px}

/* ── misc ── */
.muted{color:var(--dim);font-size:12px}
.note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;border-radius:12px;background:var(--card2);border:1px solid var(--border);color:var(--sub)}
.refresh{position:fixed;bottom:70px;right:16px;width:46px;height:46px;border-radius:50%;background:var(--grad);border:none;color:var(--brand-ink);cursor:pointer;box-shadow:0 6px 18px rgba(17,104,183,.35);display:flex;align-items:center;justify-content:center;z-index:60}
.refresh.spinning svg{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.section-note{font-size:11px;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:6px}
@media(max-width:640px){.header h1{font-size:17px}.kpi-num{font-size:22px}}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:8px">
    <span id="connDot" class="dot off"></span><span id="connText">连接中…</span>
    <span id="staleTip" class="stale-tip">数据已过期，请重新采集</span>
  </div>
  <div class="r">
    <span class="phase-chip">V5.0 全景经营指挥中心</span>
    <span id="clockDisplay" style="font-weight:700;color:var(--title)">--:--</span>
  </div>
</div>

<div class="header">
  <h1>经营指挥中心 <span class="tag" id="verTag">V5</span></h1>
  <div class="sub">
    <span id="accountName">AI工具研究所 · 内容运营中心</span>
    <span class="muted" id="lastUpdated"></span>
  </div>
</div>

<div class="tabs" id="tabbar"></div>

<!-- ═══ 1 经营总览 ═══ -->
<div class="page" id="page-overview"></div>
<!-- ═══ 2 经营数据 ═══ -->
<div class="page" id="page-data"></div>
<!-- ═══ 3 内容资产 ═══ -->
<div class="page" id="page-content"></div>
<!-- ═══ 4 工作监督 ═══ -->
<div class="page" id="page-work"></div>
<!-- ═══ 5 盈利管理 ═══ -->
<div class="page" id="page-revenue"></div>
<!-- ═══ 6 策略与复盘 ═══ -->
<div class="page" id="page-strategy"></div>
<!-- ═══ 7 经营档案 ═══ -->
<div class="page" id="page-archive"></div>
<!-- ═══ 8 系统监控 ═══ -->
<div class="page" id="page-system"></div>
<!-- ═══ 9 外观设置 ═══ -->
<div class="page" id="page-theme"></div>

<button class="refresh" id="refreshBtn" title="刷新数据">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
</button>

<script>
/* ═══════════════════════════════════════════════════════
   主题系统：CSS 变量 + data-theme + localStorage 持久化
   ═══════════════════════════════════════════════════════ */
const THEME_KEY = 'v5_ops_theme';
const PRESETS = {
  '极简白':   { brand:'#1168b7', bg:'#F4F7FB', card:'#FFFFFF', ink:'#ffffff' },
  '商务深蓝': { brand:'#1e50a0', bg:'#0d1a2b', card:'#152a44', ink:'#ffffff' },
  '深色石墨': { brand:'#5aa9ff', bg:'#0f1620', card:'#18222f', ink:'#0b1220' },
  '科技蓝':   { brand:'#2563eb', bg:'#eef4ff', card:'#ffffff', ink:'#ffffff' },
  '柔和灰':   { brand:'#64748b', bg:'#eef1f4', card:'#ffffff', ink:'#ffffff' },
};
// 文本对比色：根据背景亮度自动选深/浅，保证可读（满足 8.5）
function luma(hex){ hex=hex.replace('#',''); if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.substr(0,2),16),g=parseInt(hex.substr(2,2),16),b=parseInt(hex.substr(4,2),16);
  return (0.299*r+0.587*g+0.114*b)/255; }
function bestText(bg){ return luma(bg) > 0.6 ? '#0E233A' : '#e6edf5'; }

function applyPreset(name){
  const p = PRESETS[name]; if(!p) return;
  const t = document.documentElement;
  const light = luma(p.bg) > 0.6;
  t.style.setProperty('--brand', p.brand);
  t.style.setProperty('--bg', p.bg);
  t.style.setProperty('--card', p.card);
  t.style.setProperty('--card2', light ? '#FBFCFE' : p.card);
  t.style.setProperty('--title', bestText(p.bg));
  t.style.setProperty('--body', light ? '#415567' : '#aebccb');
  t.style.setProperty('--sub',  light ? '#5F7181' : '#8b9aab');
  t.style.setProperty('--dim',  light ? '#94A3B8' : '#5d6c7d');
  t.style.setProperty('--border', light ? '#E4E9F0' : '#2a3646');
  t.style.setProperty('--brand-ink', p.ink);
  t.style.setProperty('--grad', `linear-gradient(135deg,${p.brand},${light?'#0e9488':'#22d3ee'})`);
  document.body.setAttribute('data-mode', light?'light':'dark');
  saveTheme({mode:'custom', preset:name, custom:{}});
  markPreset(name);
}
function customColor(field, val){
  const t = document.documentElement;
  const map = { pageBg:'--bg', card:'--card', nav:'--card', accent:'--brand' };
  if(map[field]) t.style.setProperty(map[field], val);
  // 联动文字对比
  const curBg = getComputedStyle(t).getPropertyValue('--bg').trim() || '#F4F7FB';
  t.style.setProperty('--title', bestText(val===curBg?curBg:val));
  saveTheme({ mode:'custom', preset: null,
    custom: { ...(getTheme().custom||{}), [field]:val } });
  markPreset(null);
}
function getTheme(){ try{ return JSON.parse(localStorage.getItem(THEME_KEY))||{}; }catch(e){ return {}; } }
function saveTheme(obj){ localStorage.setItem(THEME_KEY, JSON.stringify(obj)); }
function modeToSystem(){ // 跟随系统
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  clearCustom(); applyThemeMode(dark?'dark':'light');
}
function clearCustom(){
  const t=document.documentElement;
  ['--brand','--bg','--card','--card2','--title','--body','--sub','--dim','--border','--brand-ink','--grad'].forEach(v=>t.style.removeProperty(v));
}
function applyThemeMode(mode){
  document.documentElement.setAttribute('data-theme', mode==='dark'?'dark':'');
  if(mode==='light') document.documentElement.removeAttribute('data-theme');
  document.body.setAttribute('data-mode', mode);
  saveTheme({ mode, preset:null, custom:getTheme().custom||{} });
}
function initTheme(){
  const th = getTheme();
  clearCustom();
  if(th.custom){ Object.entries(th.custom).forEach(([k,v])=>{
    const map={pageBg:'--bg',card:'--card',nav:'--card',accent:'--brand'};
    if(map[k]) document.documentElement.style.setProperty(map[k],v); }); }
  if(th.mode==='custom'||th.preset){ if(th.preset) applyPreset(th.preset); document.documentElement.setAttribute('data-theme',''); }
  else if(th.mode==='dark'){ document.documentElement.setAttribute('data-theme','dark'); }
  else { document.documentElement.removeAttribute('data-theme'); }
  document.body.setAttribute('data-mode', th.mode==='custom' ? (luma((th.custom.pageBg||'#F4F7FB'))>0.6?'light':'dark') : (th.mode==='dark'?'dark':'light'));
  // 跟随系统监听
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e=>{ if((getTheme().mode||'light')==='auto') applyThemeMode(e.matches?'dark':'light'); });
}

/* ═══════════════════════════════════════════════════════
   导航 + 数据加载 + 渲染
   ═══════════════════════════════════════════════════════ */
const API = '/api/data';
const RAW_DATA = 'https://raw.githubusercontent.com/xiaomingtools/wechat-ops-center/main/data/appdata.json';
let D = {};
const I = {
  ov:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
  data:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>',
  content:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  work:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
  revenue:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9h4a2 2 0 010 4H9M9 15h5"/></svg>',
  strategy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>',
  archive:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v4H4zM6 8v12h12V8M9 12h6"/></svg>',
  system:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8M12 18v2"/></svg>',
  theme:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>',
};
const TABS = [
  {id:'overview',name:'经营总览',icon:I.ov},
  {id:'data',name:'经营数据',icon:I.data},
  {id:'content',name:'内容资产',icon:I.content},
  {id:'work',name:'工作监督',icon:I.work},
  {id:'revenue',name:'盈利管理',icon:I.revenue},
  {id:'strategy',name:'策略与复盘',icon:I.strategy},
  {id:'archive',name:'经营档案',icon:I.archive},
  {id:'system',name:'系统监控',icon:I.system},
  {id:'theme',name:'外观设置',icon:I.theme},
];
function buildTabs(){
  const el=document.getElementById('tabbar');
  el.innerHTML = TABS.map(t=>`<div class="tab" data-page="${t.id}" onclick="showPage('${t.id}')">${t.icon}<span>${t.name}</span></div>`).join('');
}
function showPage(id){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active', x.dataset.page===id));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
  // 按需渲染图表
  if(id==='overview') drawTrend();
  if(id==='data'){ drawUserChart(); drawChannelChart(); }
  if(id==='theme') renderThemePanel();
  document.getElementById('tabbar').scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}
function fmtDate(s){ if(!s)return'--'; return String(s).slice(5).replace(/-/g,'/'); }
function fmtDt(iso){ if(!iso)return'--'; try{return new Date(iso).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}catch(e){return String(iso).slice(0,16);} }
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function card(title,hint,body){ return `<div class="card"><div class="card-h">${esc(title)}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>${body}</div>`; }
function emptyState(msg){ return `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 12h6"/></svg><div>${esc(msg)}</div></div>`; }

async function loadJson(url){ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(url+' -> '+r.status); return r.json(); }
async function fetchData(){
  const btn=document.getElementById('refreshBtn'); btn.classList.add('spinning');
  try{
    try{ D = await loadJson(API); document.getElementById('connText').textContent='已连接'; }
    catch(e){ D = await loadJson(RAW_DATA); document.getElementById('connText').textContent='已连接(云数据)'; }
    document.getElementById('connDot').className='dot ok';
    document.getElementById('staleTip').classList.toggle('show', D.overview?.dataFreshness==='过期');
    renderAll();
  }catch(e2){
    document.getElementById('connDot').className='dot off';
    document.getElementById('connText').textContent='连接失败，重试中…';
  }finally{ setTimeout(()=>btn.classList.remove('spinning'),350); }
}

/* ── 状态徽章（数据真实性分级）── */
function stateBadge(st){
  const map={ real:['b-ok','真实'], zero_real:['b-ok','真实为0'], no_data:['b-mute','暂无'], not_connected:['b-warn','未接入'], stale:['b-warn','过期'], unknown:['b-mute','未知'], pending:['b-info','待同步'] };
  const [cls,txt]=map[st]||map.unknown;
  return `<span class="badge ${cls}">${txt}</span>`;
}

function toggleCat(c){ _catFilter = _catFilter===c?'':c;
  document.querySelectorAll('#catChips .chip').forEach(x=>x.classList.toggle('on', x.textContent.includes(c)&&_catFilter===c));
  filterContent();
}
function filterContent(){
  const list=(()=>{
    let a=(D.articles||[]).slice();
    if(_catFilter) a=a.filter(x=>x.category===_catFilter);
    if(_artSearch) a=a.filter(x=>(x.title||'').toLowerCase().includes(_artSearch.toLowerCase()));
    if(_artSorted) a.sort((x,y)=>(y.wechatReads||0)-(x.wechatReads||0));
    return a;
  })();
  const stMap={PUBLISHED:['st-pass','已发布'],VERIFIED:['st-pending','已校验'],PENDING:['st-block','待发布']};
  document.getElementById('artList').innerHTML = `<div class="tbl-wrap"><table class="t" onclick="event.target.closest('th[data-sort]')?(_artSorted=!_artSorted,filterContent()):0">
    <thead><tr><th data-sort="1">日期</th><th>标题</th><th data-sort="1">阅读</th><th data-sort="1">分享</th><th>状态</th></tr></thead>
    <tbody>${list.slice(0,60).map(a=>{ const st=stMap[a.webStatus]||['st-mute',a.webStatus];
      return `<tr><td class="muted">${fmtDate(a.date)}</td><td style="max-width:280px">${esc(a.title)}</td><td>${a.wechatReads||0}</td><td>${a.shares||0}</td><td><span class="st ${st[0]}">${st[1]}</span></td></tr>`;}).join('') || '<tr><td colspan="5" class="muted">无匹配文章</td></tr>'}
  </tbody></table></div>`;
}

  ${card('数据状态分级','区分真实值 / 缺失状态，禁止虚构')}
  <div class="tbl-wrap"><table class="t"><thead><tr><th>指标</th><th>值</th><th>状态</th><th>来源</th><th>截至</th></tr></thead><tbody>
    ${['followers','readers30d','revenue','wxLogin','sync'].map(k=>{ const x=ds[k]||{};
      const v = k==='revenue' ? (x.value==null?'未接入':x.value) : (k==='sync'?fmtDt(x.value):x.value);
      return `<tr><td>${esc(k)}</td><td><b>${v??'--'}</b></td><td>${stateBadge(x.state)}</td><td class="muted">${esc(x.source||'--')}</td><td class="muted">${x.asOf?fmtDt(x.asOf):'--'}</td></tr>`;}).join('')}
  </tbody></table></div>`;
  document.getElementById('page-system').innerHTML=html;
}

/* ═══ 9 外观设置 ═══ */
function renderThemePanel(){
  const th=getTheme();
  let html=`
  ${card('主题模式','浅色 / 深色 / 跟随系统 / 自定义','自动保存，刷新保留')}
  <div class="tg">
    ${['light','dark','auto','custom'].map(m=>`<button class="${th.mode===m?'on':''}" onclick="setMode('${m}')">${{light:'浅色',dark:'深色',auto:'跟随系统',custom:'自定义'}[m]}</button>`).join('')}
  </div>

  ${card('预设主题','点击即应用')}
  <div class="preset" id="presetBox">${Object.keys(PRESETS).map(n=>`<button class="${th.preset===n?'on':''}" onclick="applyPreset('${n}');renderThemePanel();">
    <div class="sw"><i style="background:${PRESETS[n].bg}"></i><i style="background:${PRESETS[n].card}"></i><i style="background:${PRESETS[n].brand}"></i></div>${n}
  </button>`).join('')}</div>

  ${card('自定义颜色','即时预览，自动保证文字对比度')}
  ${['pageBg','card','nav','accent'].map(f=>{ const names={pageBg:'页面背景',card:'卡片背景',nav:'导航栏',accent:'强调色'}; const cur=(th.custom||{})[f]||{pageBg:'#F4F7FB',card:'#FFFFFF',nav:'#FFFFFF',accent:'#1168b7'}[f];
    return `<div class="colorrow"><label>${names[f]}</label><span class="hex" id="hex-${f}">${cur}</span><input type="color" value="${cur}" onchange="customColor('${f}',this.value);renderThemePanel();"></div>`;}).join('')}
  <div style="margin-top:14px"><button class="tab active" style="cursor:pointer" onclick="resetTheme()">↺ 恢复默认主题</button></div>

  <div class="note" style="margin-top:14px">外观偏好保存在浏览器 localStorage（<code>v5_ops_theme</code>），刷新/重开浏览器保留，不影响任何经营数据。已同步到本地看板与云端固定网址。</div>`;
  document.getElementById('page-theme').innerHTML=html;
}
function setMode(m){ if(m==='auto'){ modeToSystem(); } else { applyThemeMode(m); clearCustom(); getTheme().custom={}; saveTheme({mode:m,preset:null,custom:{}}); } renderThemePanel(); }
function resetTheme(){ clearCustom(); document.documentElement.removeAttribute('data-theme'); localStorage.removeItem(THEME_KEY); document.body.setAttribute('data-mode','light'); renderThemePanel(); }
function markPreset(name){ document.querySelectorAll('#presetBox button').forEach(b=>b.classList.remove('on')); if(name)document.querySelectorAll('#presetBox button').forEach(b=>{if(b.textContent.includes(name))b.classList.add('on');}); }

/* ═══ 图表 ═══ */
function lineChart(id,labels,vals,color){
  const c=document.getElementById(id); if(!c)return;
  const W=c.parentElement.clientWidth,H=180; c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';
  const ctx=c.getContext('2d'); ctx.scale(2,2);
  const pad={t:20,r:14,b:24,l:38},cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
  const max=Math.max(...vals,1)*1.15, min=0;
  const xs=i=>pad.l+(vals.length>1?i/(vals.length-1)*cw:cw/2);
  const ys=v=>pad.t+ch-((v-min)/(max-min||1))*ch;
  ctx.font='10px sans-serif'; ctx.fillStyle='#94A3B8';
  for(let g=0;g<=4;g++){ const y=pad.t+ch-g/4*ch; ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--border'); ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke(); ctx.fillText(Math.round(max*g/4),4,y+3); }
  ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
  vals.forEach((v,i)=>{ const x=xs(i),y=ys(v); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); ctx.stroke();
  ctx.fillStyle=color; vals.forEach((v,i)=>{ ctx.beginPath();ctx.arc(xs(i),ys(v),3,0,7);ctx.fill(); });
  const lb=document.getElementById(id+'Labels');
  if(lb) lb.innerHTML=labels.map(l=>`<span>${l}</span>`).join('');
}
function drawTrend(){ const d=D.trend||[]; if(!d.length)return;
  lineChart('trendChart', d.map(x=>x.date), d.map(x=>x.reads), getComputedStyle(document.documentElement).getPropertyValue('--c1')); }
function drawUserChart(){ const d=(D.userTrend||[]); if(!d.length)return;
  lineChart('userChart', d.map(x=>x.date), d.map(x=>x.total), getComputedStyle(document.documentElement).getPropertyValue('--c2')); }
function drawChannelChart(){ const c=document.getElementById('chanChart'); if(!c)return;
  const W=c.parentElement.clientWidth,H=40; c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';
  const ctx=c.getContext('2d'); ctx.scale(2,2);
  const ch=D.wrChannels||{}; const cols=getComputedStyle(document.documentElement);
  const palette=[cols.getPropertyValue('--c1'),cols.getPropertyValue('--c2'),cols.getPropertyValue('--c3'),cols.getPropertyValue('--c4'),cols.getPropertyValue('--c5')];
  const total=Object.values(ch).reduce((s,v)=>s+(+v||0),0)||1; let x=0;
  Object.entries(ch).forEach(([k,v],i)=>{ const w=(+v||0)/total*W; ctx.fillStyle=palette[i%palette.length]; ctx.fillRect(x,0,w,H);
    if(w>34){ ctx.fillStyle='#fff'; ctx.font='bold 11px sans-serif'; ctx.fillText(k+' '+(+v||0)+'%',x+6,H/2+4);} x+=w; });
  // 图例
  const ly=H; ctx.font='10px sans-serif';
  Object.entries(ch).forEach(([k,v],i)=>{ ctx.fillStyle=palette[i%palette.length]; ctx.fillRect(0,ly,10,10); ctx.fillStyle=cols.getPropertyValue('--body'); ctx.fillText(k,14,ly+9); });
}

/* ── 时钟 ── */
function tick(){ const n=new Date(); const el=document.getElementById('clockDisplay'); if(el)el.textContent=n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0'); }

/* ── 历史报告（从 weekly_review 目录读取，可选）── */
let REVIEWS=[];
async function loadReviews(){
  try{
    const base = location.protocol==='file:'?'':'/';
    const r=await fetch(base+'api/reviews',{cache:'no-store'});
    if(r.ok){ REVIEWS=(await r.json()).reviews||[]; }
  }catch(e){ /* 无该端点则跳过，复盘区显示暂无 */ }
}

buildTabs();

loadReviews().then(()=>{ fetchData(); });
document.getElementById('refreshBtn').onclick=fetchData;
